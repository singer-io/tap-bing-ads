version: 2.1
orbs:
  slack: circleci/slack@3.4.2
jobs:
  build:
    docker:
      - image: 218546966473.dkr.ecr.us-east-1.amazonaws.com/circle-ci:stitch-tap-tester-uv
    steps:
      - checkout
      - run:
          name: 'Setup virtual env'
          command: |
            uv venv --python 3.12 /usr/local/share/virtualenvs/tap-bing-ads
            source /usr/local/share/virtualenvs/tap-bing-ads/bin/activate
            uv pip install -U pip setuptools
            uv pip install .[test]
            uv pip install .[dev]
            uv pip install pylint
      - run:
          name: 'pylint'
          command: |
            source /usr/local/share/virtualenvs/tap-bing-ads/bin/activate
            pylint tap_bing_ads -d C,R,W
      - run:
          name: 'Unit Tests & Coverage Run'
          command: |
            source /usr/local/share/virtualenvs/tap-bing-ads/bin/activate
            uv pip install pytest coverage parameterized
            mkdir -p htmlcov
            coverage run --source=tap_bing_ads -m pytest tests/unittests --junitxml=htmlcov/report.xml
            coverage html
      - run:
          name: 'Coverage Report'
          command: |
            source /usr/local/share/virtualenvs/tap-bing-ads/bin/activate
            coverage report -m | tee coverage.txt
            coverage html
      - store_test_results:
          path: htmlcov/report.xml
      - store_artifacts:
          path: htmlcov
      - run:
          name: 'Integration Tests'
          command: |
            source /usr/local/share/virtualenvs/tap-tester/bin/activate
            uv pip install --upgrade awscli
            aws s3 cp s3://com-stitchdata-dev-deployment-assets/environments/tap-tester/tap_tester_sandbox dev_env.sh
            source dev_env.sh
            mkdir /tmp/${CIRCLE_PROJECT_REPONAME}
            export STITCH_CONFIG_DIR=/tmp/${CIRCLE_PROJECT_REPONAME}
            run-test --tap=tap-bing-ads tests
      - slack/notify-on-failure:
          only_for_branches: master
      - store_artifacts:
          path: /tmp/tap-bing-ads
workflows:
  version: 2
  commit: &commit_jobs
    jobs:
      - build:
          context:
          - circleci-user
          - tier-1-tap-user
  build_daily:
    <<: *commit_jobs
    triggers:
      - schedule:
          cron: "0 1 * * *"
          filters:
            branches:
              only:
                - master
